<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Turno - Digiturnos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    body {
      display: flex;
    }
    .sidebar {
      width: 220px;
      background-color: #004094;
      color: white;
      min-height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      padding-top: 60px;
    }
    .sidebar a {
      display: block;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #f9d55c;
    }
    .content {
      margin-left: 220px;
      padding: 20px;
      width: 100%;
    }
    .topbar {
      position: fixed;
      top: 0;
      left: 220px;
      right: 0;
      background-color: #dde0e2;
      height: 60px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid #dee2e6;
    }
    .profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .profile img {
      width: 35px;
      height: 35px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <!-- Barra lateral -->
<div class="sidebar">
  <h3 class="text-center mb-4">Panel de Admin </h3>
  <a href="{{ url_for('admin') }}"><i class="bi bi-calendar"></i> Turnos</a>
  <a href="{{ url_for('admin_usuarios') }}"><i class="bi bi-people"></i> Usuarios</a>
  <a href="{{ url_for('reportes') }}"><i class="bi bi-bar-chart"></i> Reportes</a>
  <a href="{{ url_for('admin_notificaciones') }}"><i class="bi bi-bell"></i> Notificaciones</a>
  <a href="{{ url_for('admin_sugerencias') }}"><i class="bi bi-chat-dots"></i> Sugerencias</a>
  <a href="{{ url_for('configuracion_admin') }}"><i class="bi bi-gear"></i> Configuración</a>
  <a href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
</div>
  <!-- Barra superior -->
  <div class="topbar">
    <div class="profile">
      
      <span>{{ session['usuario'] }}</span>
      <img src="{{ url_for('static', filename='images/admin.png') }}" alt="Foto Admin">
    </div>
  </div>

  <!-- Contenido principal -->
  <div class="content mt-5">
    <h2 class="text-warning mb-4">Editar Turno</h2>

    <div class="card shadow-sm">
      <div class="card-body">
        <form method="POST">

          <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input type="date" name="fecha" class="form-control" value="{{ turno.fecha }}" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Tipo de Turno</label>
            <select name="tipo_turno" class="form-control" required>
              <option value="Diurno" {% if turno.tipo_turno == "Diurno" %}selected{% endif %}>Diurno (6:00 AM - 6:00 PM)</option>
              <option value="Nocturno" {% if turno.tipo_turno == "Nocturno" %}selected{% endif %}>Nocturno (6:00 PM - 6:00 AM)</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Estado</label>
            <select name="estado" class="form-control">
              <option value="En espera" {% if turno.estado == "En espera" %}selected{% endif %}>En espera</option>
              <option value="Asignado" {% if turno.estado == "Asignado" %}selected{% endif %}>Asignado</option>
              <option value="Finalizado" {% if turno.estado == "Finalizado" %}selected{% endif %}>Finalizado</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Asignar a usuario</label>
            <select name="user_id" class="form-control" required>
              {% for u in usuarios %}
              <option value="{{ u.id }}" {% if u.id == turno.user_id %}selected{% endif %}>{{ u.usuario }}</option>
              {% endfor %}
            </select>
          </div>

          <button type="submit" class="btn btn-primary">Guardar cambios</button>
          <a href="{{ url_for('admin') }}" class="btn btn-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
