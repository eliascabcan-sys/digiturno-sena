        <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrarse en Floridablanca-Digiturno</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: linear-gradient(135deg, rgb(212, 175, 55)  0%, #539dff 100%);
            color: #444;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .login-container {
            background: #fff;
            margin: 4em auto;
            padding: 4em 2em 2em 1em;
            border-radius: 30px;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(200,200,200,0.12), 0 2px 8px rgba(0,0,0,0.08);
            position: relative;
        }
      
        
        h2 {
            margin-bottom: 1.5em;
            color: #004094;
            font-size: 3em;
            font-weight: bold;
            letter-spacing: 1px;
            z-index: 1;
            position: relative;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            position: relative;
        }
        label {
            width: 80%;
            max-width: 300px;
            margin: 0.5em auto 0.2em auto;
            font-size: 1.05em;
            color:  rgb(212, 175, 55);
            text-align: left;
            font-weight: 500;
        }
        input {
            width: 80%;
            max-width: 300px;
            padding: 0.7em;
            border-radius: 12px;
            border: 1.5px solid rgb(212, 175, 55);
            margin-bottom: 1em;
            font-size: 1em;
            background: #f8f9fa;
            transition: border 0.2s, background 0.2s;
        }
        input:focus {
            border: 2px solid  rgb(212, 175, 55);
            outline: none;
            background:  rgb(212, 175, 55);
        }
        button {
            background: linear-gradient(90deg,  #3b90ff 60%,  rgb(212, 175, 55) 100%);
            color: #444;
            border: none;
            border-radius: 12px;
            padding: 0.9em 2.5em;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1em;
            box-shadow: 0 2px 8px rgba(200,200,200,0.10);
            transition: background 0.2s, transform 0.2s;
        }
        button:hover {
            background: linear-gradient(90deg,  rgb(212, 175, 55) 60%,  #4e9ffc 100%);
            transform: scale(1.04);
        }
        .register-link {
            margin-top: 1.5em;
            display: block;
            color:  #3277d1;
            text-decoration: underline;
            font-size: 1em;
            font-weight: 500;
            transition: color 0.2s;
        }
        .register-link:hover {
            color: rgb(212, 175, 55);
        }
        @media (max-width: 500px) {
            .login-container {
                padding: 1.5em 0.5em;
                max-width: 95vw;
            }
            label, input, button {
                width: 95%;
                max-width: 95vw;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Registrarse</h2>
        <form method="POST" action="/regis">
    <label for="usuario">Nombre completo:</label>
    <input type="text" id="usuario" name="usuario" required>

    <label for="correo">Correo:</label>
    <input type="email" id="correo" name="correo" required>

    <label for="telefono">Teléfono:</label>
    <input type="text" id="telefono" name="telefono" required>

    <label for="contrasena">Contraseña:</label>
    <input type="password" id="contrasena" name="contrasena" required>

    <button type="submit">Registrarse</button>
</form>
         <a href="{{ url_for('home') }}" class="register-link">← Volver a la página principal</a>
         <a href="{{ url_for('login') }}" class="register-link">¿Ya tienes cuenta? Inicia sesión</a><br>
    
    </div>
</body>
